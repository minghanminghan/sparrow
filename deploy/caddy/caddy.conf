# Drop-in for the apt caddy.service: deploy/caddy/setup.sh installs it to /etc/systemd/system/caddy.service.d.
[Unit]
# Caddy binds the tailscale IPs, which exist only once tailscaled is up.
After=tailscaled.service
Wants=tailscaled.service

[Service]
EnvironmentFile=/etc/caddy/caddy.env
# Same as the stock unit minus --environ, which would print the Vercel token to the journal.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
Restart=on-failure
RestartSec=5
